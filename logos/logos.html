<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MisTech — Logo Concepts</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background: #0A0812; color: #F4EFE3; font-family: 'Satoshi', system-ui, sans-serif; }
    .logo-art {
      width: 720px;
      padding: 56px 48px 48px;
      background: #14111F;
      color: #F4EFE3;
      box-sizing: border-box;
      border-radius: 0;
      position: relative;
      overflow: hidden;
    }
    .logo-art.light { background: #F4EFE3; color: #0A0812; }
    @keyframes blink { 50% { opacity: 0; } }
    .la-row { display: grid; grid-template-columns: 200px 1fr; gap: 36px; align-items: center; margin-bottom: 32px; }
    .la-label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.55; }
    .la-rule { height: 1px; background: currentColor; opacity: 0.08; margin: 28px 0; }
    .la-foot { display: flex; justify-content: space-between; padding-top: 24px; border-top: 1px dashed currentColor; opacity: 0.45; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; }
    .la-context { display: flex; gap: 18px; align-items: center; padding: 18px 22px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(244,239,227,0.08); }
    .light .la-context { background: rgba(0,0,0,0.04); border-color: rgba(10,8,18,0.08); }
    .la-favbg { width: 64px; height: 64px; background: linear-gradient(135deg, #6B4EFF, #4A2EE8); border-radius: 12px; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(107,78,255,0.35); flex-shrink: 0; }
    .la-mockmail { flex: 1; padding: 12px 14px; background: rgba(255,255,255,0.04); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    .light .la-mockmail { background: rgba(0,0,0,0.05); }
    .la-rationale { font-family: 'Newsreader', serif; font-style: italic; font-size: 15px; line-height: 1.55; opacity: 0.85; max-width: 580px; margin: 12px 0 0; }
    .la-title { font-family: 'Satoshi', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.025em; margin: 0 0 4px; }
    .la-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.5; margin-bottom: 28px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="logos.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LogoCanvas />);
  </script>
</body>
</html>
